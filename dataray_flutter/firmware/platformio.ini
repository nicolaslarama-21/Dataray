[platformio]
default_envs = transmitter, receiver
[env]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_type = debug
#doit esp32 devkit v1
#esp32dev
[env:transmitter]
build_flags = -D DATARAY_TRANSMITTER=1

[env:receiver]
build_flags = -D DATARAY_TRANSMITTER=0

